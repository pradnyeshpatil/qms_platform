name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: qms, POSTGRES_USER: qms, POSTGRES_PASSWORD: qms }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qms -d qms" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: qms
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms
      DJANGO_SECRET_KEY: ci-only-not-a-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations are committed (no model drift)
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (tenant isolation, RBAC, auth, employees)
        run: python -m pytest
      - name: Dependency audit (informational)
        run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Dependency audit (informational)
        run: npm audit --omit=dev
        continue-on-error: true
