<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset=".55" stop-color="#312e81"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
    <radialGradient id="glow1" cx=".85" cy=".1" r=".6"><stop offset="0" stop-color="#818cf8" stop-opacity=".55"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".1" cy=".95" r=".6"><stop offset="0" stop-color="#38bdf8" stop-opacity=".4"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#c7d2fe" stroke-opacity=".09"/></pattern>
    <path id="gear" d="M0-64l12 0 5 16a50 50 0 0 1 14 6l15-8 17 17-8 15a50 50 0 0 1 6 14l16 5v24l-16 5a50 50 0 0 1-6 14l8 15-17 17-15-8a50 50 0 0 1-14 6l-5 16h-24l-5-16a50 50 0 0 1-14-6l-15 8-17-17 8-15a50 50 0 0 1-6-14l-16-5v-24l16-5a50 50 0 0 1 6-14l-8-15 17-17 15 8a50 50 0 0 1 14-6l5-16z M0-26a26 26 0 1 0 .1 0z" fill-rule="evenodd" transform="scale(1.05)"/>
  </defs>
  <rect width="900" height="1100" fill="url(#bg)"/>
  <rect width="900" height="1100" fill="url(#grid)"/>
  <rect width="900" height="1100" fill="url(#glow1)"/>
  <rect width="900" height="1100" fill="url(#glow2)"/>
  <!-- gears: manufacturing -->
  <use href="#gear" x="700" y="230" fill="#a5b4fc" fill-opacity=".12"/>
  <use href="#gear" x="560" y="372" fill="#7dd3fc" fill-opacity=".10" transform="rotate(14 560 372) scale(.7)"/>
  <use href="#gear" x="130" y="900" fill="#a5b4fc" fill-opacity=".10" transform="scale(1.4) translate(-35 -250)"/>
  <!-- inspection / measurement arcs -->
  <g fill="none" stroke="#c7d2fe" stroke-opacity=".2" stroke-width="1.5">
    <circle cx="640" cy="760" r="150"/><circle cx="640" cy="760" r="110" stroke-dasharray="4 8"/><circle cx="640" cy="760" r="60"/>
    <path d="M640 590v60M640 870v60M470 760h60M750 760h60"/>
  </g>
  <!-- quality-check card -->
  <g transform="translate(110 560)">
    <rect width="330" height="170" rx="22" fill="#fff" fill-opacity=".09" stroke="#c7d2fe" stroke-opacity=".3"/>
    <circle cx="46" cy="48" r="20" fill="#34d399" fill-opacity=".9"/><path d="M37 48l7 7 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="82" y="34" width="150" height="10" rx="5" fill="#fff" fill-opacity=".7"/><rect x="82" y="54" width="100" height="8" rx="4" fill="#fff" fill-opacity=".35"/>
    <rect x="28" y="96" width="274" height="8" rx="4" fill="#fff" fill-opacity=".15"/><rect x="28" y="96" width="206" height="8" rx="4" fill="#818cf8"/>
    <rect x="28" y="124" width="274" height="8" rx="4" fill="#fff" fill-opacity=".15"/><rect x="28" y="124" width="150" height="8" rx="4" fill="#38bdf8"/>
  </g>
  <!-- complaint trend -->
  <g transform="translate(200 790)">
    <rect width="300" height="150" rx="22" fill="#fff" fill-opacity=".07" stroke="#c7d2fe" stroke-opacity=".25"/>
    <path d="M24 110 L70 84 L116 96 L162 56 L208 70 L276 28" fill="none" stroke="#a5b4fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff"><circle cx="70" cy="84" r="4.5"/><circle cx="162" cy="56" r="4.5"/><circle cx="276" cy="28" r="4.5"/></g>
  </g>
  <!-- shield -->
  <g transform="translate(560 120)"><path d="M70 0l70 24v58c0 44-30 74-70 92C30 156 0 126 0 82V24z" fill="#fff" fill-opacity=".1" stroke="#c7d2fe" stroke-opacity=".45" stroke-width="2"/><path d="M42 84l20 20 38-42" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
